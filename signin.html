<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrator Login</title>
     <link rel="icon" type="png" href="./TAT.png">
  <link rel="stylesheet" href="./signin.css" />

  <!-- Font Awesome for eye icon -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">

      <!-- LEFT IMAGE PANEL (structure unchanged) -->
      <div class="card-left">
        <img src="./TATA.png" alt="Taekwondo Background" />
      </div>

      <!-- RIGHT LOGIN PANEL -->
      <div class="card-right">

        <div class="login-header">
          <img src="./TAT.png" alt="Logo" class="logo" />
          <h2>Administrator Login</h2>
          <p class="subtitle">Authorized access only</p>
        </div>

        <!-- Username -->
        <input type="text" id="username" placeholder="Admin Username" />

        <!-- Password with toggle -->
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Password" />
          <span class="toggle-password" onclick="togglePassword()">
            <i class="fa fa-eye" id="eyeIcon"></i>
          </span>
        </div>

        <!-- Button -->
        <button onclick="adminLogin()">Sign In</button>

        <!-- Error -->
        <p id="error-msg" style="display:none; color:red; text-align:center;">
          Invalid username or password
        </p>

        <p class="footer-text">Restricted to authorized personnel</p>
      </div>

    </div>
  </div>

  <!-- Footer -->
<!-- BRANDING ONLY -->
<div class="branding-standalone">
  <div class="branding-inner">

    <div class="powered-by">
      <span>Powered by</span>
      <img src="./OTALOGOCDR.jpg" alt="OTASPORTS">
    </div>

    <div class="copyright">
      Copyright © 2026 OTASPORTS. All rights reserved.
      |
      <a href="#">Terms of Use</a>
      |
      <a href="#">Privacy Policy</a>
      |
      <a href="#">Contact Us</a>
    </div>

  </div>
</div>

  <!-- =========================
       JAVASCRIPT (ADDED)
  ========================= -->
  <script>
    function adminLogin() {
      const ADMIN_USERNAME = "admin";
      const ADMIN_PASSWORD = "tat@123";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        alert("Please enter username and password");
        return;
      }

      if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
        sessionStorage.setItem("isAdminLoggedIn", "true");
        window.location.replace("dashboard.html");
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function togglePassword() {
      const pwd = document.getElementById("password");
      const icon = document.getElementById("eyeIcon");

      if (pwd.type === "password") {
        pwd.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        pwd.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Enter key support
    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        adminLogin();
      }
    });
  </script>


</body>
</html>
